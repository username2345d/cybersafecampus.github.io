<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CyberSafe Campus</title>

  <!-- Estilos: paleta UNAD, layout y actividades -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Bandera UNAD: franjas azul, naranja y amarillo -->
  <div class="flag"><i></i><i></i><i></i></div>

  <!-- Encabezado: logo (vuelve al inicio) y botón de idioma ES/EN -->
  <header>
    <button class="logo" id="homeBtn">🛡️ <span>CyberSafe Campus</span></button>
    <button class="btn sm" id="langBtn">EN</button>
  </header>

  <!-- Barra de progreso: js/app.js ajusta su ancho según la pantalla -->
  <div class="progress"><div id="bar"></div></div>

  <!-- Contenedor principal: js/app.js dibuja aquí cada pantalla (Home, módulos, Créditos) -->
  <main id="app"></main>

  <!-- Pie de página (texto traducido por JS) -->
  <footer id="foot">Recurso educativo multimedia · UNAD</footer>

  <!-- Lógica y contenido bilingüe de la aplicación -->
  <script src="js/app.js"></script>
</body>
</html>
